project:
  type: website

website:
  title: "ImgLib2 news and tutorials"
  announcement:
    icon: info-circle
    dismissable: false
    type: warning
    position: above-navbar
    content: |
      This blog is retired and is no longer updated. Visit
      [imglib2.net](https://imglib2.net/) for current ImgLib2 documentation.
  image: imglib2-logo.png
  favicon: favicon.ico
  navbar:
    logo: imglib2-logo-header.png
    right:
      - about.qmd
      - icon: github
        href: https://github.com/imglib
      - icon: mastodon
        href: https://fosstodon.org/@imglib2
      - icon: rss
        href: index.xml
  open-graph: true
  repo-url: https://github.com/imglib/imglib2-blog
  site-url: https://imglib.github.io/imglib2-blog
format:
  html:
    theme: cosmo
    css: styles.css
    code-fold: show
    code-overflow: wrap
    code-tools:
      source: repo
